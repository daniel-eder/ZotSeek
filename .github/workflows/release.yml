name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update manifest version
      run: |
        jq --arg version "${{ steps.get_version.outputs.VERSION }}" '.version = $version' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json
        # Also update package.json version to match
        jq --arg version "${{ steps.get_version.outputs.VERSION }}" '.version = $version' package.json > package.tmp.json && mv package.tmp.json package.json

    - name: Build
      run: npm run build

    - name: Build XPI
      run: |
        cd build
        zip -r ../zotseek-${{ steps.get_version.outputs.VERSION }}.xpi *

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: zotseek-${{ steps.get_version.outputs.VERSION }}.xpi
        generateReleaseNotes: true

    - name: Update update.json on main
      if: success()
      run: |
        # Get Addon ID from manifest
        ADDON_ID=$(jq -r '.applications.zotero.id' manifest.json)
        
        # Discard changes to manifest.json/package.json
        git checkout .
        
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        git fetch origin main
        git checkout main
        
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        LINK="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/zotseek-${VERSION}.xpi"
        
        # Update update.json
        jq --arg version "$VERSION" --arg link "$LINK" --arg id "$ADDON_ID" '
          .addons[$id].updates |= ([{
            "version": $version,
            "update_link": $link,
            "applications": {
              "zotero": {
                "strict_min_version": "7.999"
              }
            }
          }] + .)' update.json > update.json.tmp && mv update.json.tmp update.json
          
        git add update.json
        if git diff --staged --quiet; then
          echo "No changes to update.json"
        else
          git commit -m "chore: update update.json for v$VERSION [skip ci]"
          git push origin main
        fi
